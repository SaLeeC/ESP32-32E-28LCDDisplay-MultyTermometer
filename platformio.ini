[env:cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    paulstoffregen/OneWire@2.3.8
    milesburton/DallasTemperature@3.11.0
build_flags =
    -D USER_SETUP_LOADED
    -D ILI9341_2_DRIVER
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D USE_HSPI_PORT
    -D LOAD_GLCD
    -D LOAD_FONT2
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
