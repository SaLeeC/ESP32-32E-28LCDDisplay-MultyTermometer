[env:cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.partitions = partitions_ota_no_filesystem.csv
monitor_speed = 115200
extra_scripts = pre:tools/embed_logo_png.py
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    paulstoffregen/OneWire@2.3.8
    milesburton/DallasTemperature@3.11.0
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit MCP9808 Library@2.0.2
    adafruit/Adafruit AHTX0@2.0.5
    adafruit/Adafruit Si7021 Library@1.5.3
    adafruit/Adafruit HTU21DF Library@1.1.2
    ivans/Generic HDC1080
    adafruit/Adafruit SHT31 Library@2.2.2
    adafruit/Adafruit SHT4x Library@1.0.5
    sparkfun/SparkFun TMP102 Breakout@1.1.2
    sparkfun/SparkFun High Precision Temperature Sensor TMP117 Qwiic@1.2.5
    jeremycole/I2C Temperature Sensors derived from the LM75@1.0.3
    adafruit/Adafruit AM2320 sensor library@1.2.5
    robtillaart/DHT12@0.5.2
    adafruit/Adafruit SHTC3 Library@1.0.2
    adafruit/Adafruit BMP280 Library@2.6.8
    adafruit/Adafruit BME280 Library@2.3.0
    boschsensortec/BME68x Sensor library@1.3.40408
    bodmer/TFT_Touch@^0.3
    bitbank2/PNGdec@^1.1.6
build_flags =
    -D USER_SETUP_LOADED
    -D ILI9341_2_DRIVER
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D USE_HSPI_PORT
    -D LOAD_GLCD
    -D LOAD_FONT2
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000

[env:cyd-driver-footprint]
extends = env:cyd
build_flags =
    ${env:cyd.build_flags}
    -D SENSOR_DRIVER_FOOTPRINT_PROBE
